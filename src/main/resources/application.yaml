server:
  port: 8087

spring:
  application:
    name: api-gateway-service
  security:
    oauth2:
      client:
        registration:                     #caller
          goon-internal:
            provider: goon-keycloak
            client-id: ${GOON_SERVICE_CLIENT_ID:api-gateway}
            client-secret: ${GOON_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
            - pricing.quote
        provider:     #token endpoint for jwt token
          goon-keycloak:
            issuer-uri: http://localhost:8090/realms/goon-internal-auth
  grpc:
    client:
      channel:
        pricing:
          target: static://localhost:9090
          ssl:
            enabled: false


  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/customer/**,/customer/**

            - id: driver-service
              uri: http://localhost:8082
              predicates:
                - Path=/auth/driver/**,/driver/**,/api/driver/**,/offers/**

            - id: ride-service
              uri: http://localhost:8083
              predicates:
                - Path=/rides/**

            - id: location-ingestion-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/ingestion


app:
