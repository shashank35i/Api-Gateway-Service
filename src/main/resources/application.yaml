server:
  port: 8087

spring:
  application:
    name: api-gateway-service
  security:
    oauth2:
      client:
        registration:                     #caller
          goon-internal:
            provider: goon-keycloak
            client-id: goon-services
            client-secret: G2Wc2qAtPASfbgGj7kdMEo8w8K4ZVaq6idKGlCqINeQW8BpWprYmltTlI9SqDIWIBe4xRdogXo2nVDPEiG2Flm
            authorization-grant-type: client_credentials
            scope:
            - pricing.quote
          goon-customer:
            provider: goon-keycloak
            client-id: goon-services
            client-secret: G2Wc2qAtPASfbgGj7kdMEo8w8K4ZVaq6idKGlCqINeQW8BpWprYmltTlI9SqDIWIBe4xRdogXo2nVDPEiG2Flm
            authorization-grant-type: client_credentials
            scope:
              - customer.access
            # Configure the audience mapper on this Keycloak scope: customer-service
          goon-driver:
            provider: goon-keycloak
            client-id: goon-services
            client-secret: G2Wc2qAtPASfbgGj7kdMEo8w8K4ZVaq6idKGlCqINeQW8BpWprYmltTlI9SqDIWIBe4xRdogXo2nVDPEiG2Flm
            authorization-grant-type: client_credentials
            scope:
              - driver.access
            # Configure the audience mapper on this Keycloak scope: driver-service
          goon-rides:
            provider: goon-keycloak
            client-id: goon-services
            client-secret: G2Wc2qAtPASfbgGj7kdMEo8w8K4ZVaq6idKGlCqINeQW8BpWprYmltTlI9SqDIWIBe4xRdogXo2nVDPEiG2Flm
            authorization-grant-type: client_credentials
            scope:
              - rides.create
            # Configure the audience mapper on this Keycloak scope: ride-service
          goon-location-ingestion:
            provider: goon-keycloak
            client-id: goon-services
            client-secret: G2Wc2qAtPASfbgGj7kdMEo8w8K4ZVaq6idKGlCqINeQW8BpWprYmltTlI9SqDIWIBe4xRdogXo2nVDPEiG2Flm
            authorization-grant-type: client_credentials
            scope:
              - location.ingest
            # Configure the audience mapper on this Keycloak scope: location-ingestion-service
          goon-payments:
            provider: goon-keycloak
            client-id: goon-services
            client-secret: ${spring.security.oauth2.client.registration.goon-internal.client-secret}
            authorization-grant-type: client_credentials
            scope:
              - payments.checkout
            # Keycloak audience mapper on payments.checkout: payment-service
        provider:     #token endpoint for jwt token
          goon-keycloak:
            issuer-uri: http://localhost:8090/realms/goon-internal-auth
  grpc:
    client:
      channel:
        pricing:
          target: static://localhost:9090
          ssl:
            enabled: false


  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer-service
              uri: http://localhost:8088
              predicates:
                - Path=/auth/customer/**,/customer/**
              filters:
                - TokenRelay=goon-customer

            - id: driver-service
              uri: http://localhost:8084
              predicates:
                - Path=/auth/driver/**,/driver/**,/api/driver/**,/offers/**
              filters:
                - TokenRelay=goon-driver

            - id: ride-service
              uri: http://localhost:8083
              predicates:
                - Path=/rides/**
              filters:
                - TokenRelay=goon-rides

            - id: location-ingestion-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/ingestion
              filters:
                - TokenRelay=goon-location-ingestion

            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/register_fcm_token

            - id: payment-service
              uri: http://localhost:8089
              predicates:
                - Path=/payments/**
              filters:
                - TokenRelay=goon-payments

            - id: payment-webhook
              uri: http://localhost:8089
              predicates:
                - Path=/webhooks/razorpay

            - id: payment-checkout-page
              uri: http://localhost:8089
              predicates:
                - Path=/payment-checkout.html

app:
  jwt-secret-key: 7y9V/kZ7P5xWb2NmTF9uK3R6VzRyUXBTMTR2WGNBbUo=


GOON_KEYCLOAK_ISSUER: http://localhost:8090/realms/goon-internal-auth
